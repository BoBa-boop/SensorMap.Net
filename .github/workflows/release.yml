name: "Realese"

on:
 push: 
  tags: 
    - "v*"
jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
  
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
           dotnet-version: 9.0.x

      - name: Версия из тега
        shell: pwsh
        run: |
            $v = "${{github.ref_name }}".TrimStart("v")
            echo "VERSION=$v" >> $env:GITHUB_ENV

      - name: Установить vpk
        run: dotnet tool install -g vpk
             
      - name: Publish
        run: |
            dotnet publish SensorMap/SensorMap.csproj -c Release -r win-x64 --self-contained -p:Version=${{ env.VERSION }} -o publish

      - name: Pack
        run: |
          vpk pack --packId SensorMap --packVersion ${{ env.VERSION }} --packDir publish --mainExe SensorMap.exe --outputDir Releases

      - name: Скачать предыдущие релизы (для дельта-пакетов)
        continue-on-error: true
        run: |
            vpk download github --repoUrl https://github.com/${{ github.repository }} --token ${{secrets.GITHUB_TOKEN }}
      
      - name: Upload
        run: |
            vpk upload github --repoUrl https://github.com/${{ github.repository }} --token ${{secrets.GITHUB_TOKEN }} --publish --releaseName ${{ env.VERSION }} --tag ${{ github.ref_name }}